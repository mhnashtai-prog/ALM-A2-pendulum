<title>INTUITY — Grammar</title>

<!--
  This page is self-contained: it declares its own copy of the shell tokens
  and the pendulum/sheet styles instead of linking intuity-shell.css, which
  isn't reachable from a standalone preview. Drop this file into the site
  and swap the block below for a <link> to the real shell — the class names
  (.pend-hang, .pend-dial, .sheet, .sheet-card, .mode-btn …) match on purpose
  so nothing else in the page needs to change.
-->
<style>
:root{
  --bg:#F3F1ED; --ink:#201E1C; --dim:#6B655D; --faint:#9A948A; --rule:#E2DCD1;
  --f-display:'Geist',-apple-system,sans-serif; --f-mono:'Geist Mono',monospace;
  --accent:#DD8E58; --accent-ink:#9A5A2C;
  --mark-sweep:#708A81; --mark-core:#201E1C; --mark-ink:#E5D1B8;
  --tile-bg:#EAE4D8; --tile-bg-press:#E0D9CB; --tile-ink:#4A433D;
  --slot-bg:#E6E0D4; --wrong:#B84A3E; --green:#5A8A5E; --r-chip:8px;
  --gutter:1.4rem; --dial:clamp(92px,21vw,132px);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-display);
  min-height:100dvh;display:flex;flex-direction:column;}

/* ── header, matching the Speaking hub's shape ─────────────────────── */
.header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--rule);
  padding:0 var(--gutter);z-index:5;}
.header-top{display:flex;align-items:center;justify-content:space-between;
  padding:1rem 0 .6rem;gap:1rem;}
.back-link{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);text-decoration:none;}
.header-title{text-align:center;}
.app-title{font-weight:900;letter-spacing:.08em;font-size:.95rem;}
.app-subtitle{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);}
.header-spacer{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;
  color:var(--dim);background:var(--tile-bg);padding:.3rem .6rem;border-radius:var(--r-chip);}
.header-spacer b{color:var(--ink);}
.scoreboard{display:flex;gap:.5rem;}
.pill{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.04em;color:var(--ink);
  background:var(--tile-bg);padding:.3rem .6rem;border-radius:999px;transition:transform .2s;}
.pill.pulse{animation:pulsey .4s ease;}
@keyframes pulsey{50%{transform:scale(1.25);}}

/* ── the gate: 2x2 pendulums ────────────────────────────────────────── */
.gate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem var(--gutter) 3rem;}
.dials{display:grid;grid-template-columns:repeat(2,auto);
  gap:clamp(2.6rem,8vh,4.2rem) clamp(1.8rem,11vw,4.5rem);
  justify-items:center;align-items:start;place-content:center;margin:0 auto;}
.dial-b{display:flex;flex-direction:column;align-items:center;gap:.9rem;
  border:none;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;}
.dial-b .pend-hang{display:block;width:var(--dial);height:var(--dial);
  will-change:transform;backface-visibility:hidden;position:relative;
  animation:pendCalm 5.2s cubic-bezier(.37,0,.63,1) infinite;}
.dial-b .pend-hang::before{content:'';position:absolute;left:50%;top:-40px;
  width:1px;height:40px;background:var(--rule);transform:translateX(-50%);}
.pend-dial{width:100%;height:100%;border-radius:50%;background:var(--mark-core);
  box-shadow:0 0 0 6px var(--mark-sweep);display:flex;align-items:center;justify-content:center;}
.pend-dial span{font-size:calc(var(--dial) * .3);color:var(--mark-ink);font-weight:900;}
@keyframes pendCalm{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}
@media(prefers-reduced-motion:reduce){.dial-b .pend-hang{animation:none;transform:rotate(0);}}
.dial-name{font-size:.78rem;font-weight:600;letter-spacing:.01em;color:var(--dim);
  transition:color .15s;}
.dial-b:hover .dial-name,.dial-b:focus-visible .dial-name{color:var(--accent-ink);}
.dial-b:focus-visible{outline:none;}
.dial-b:focus-visible .pend-dial{outline:2px solid var(--accent-ink);outline-offset:7px;}
.dial-b:active .pend-hang{transform:scale(.95);}
.dial-track{width:var(--dial);height:5px;border-radius:2px;background:var(--slot-bg);
  overflow:hidden;}
.dial-track i{display:block;height:100%;background:var(--accent);width:0%;transition:width .3s;}

/* ── sheet / card ───────────────────────────────────────────────────── */
.sheet{position:fixed;inset:0;background:rgba(32,30,28,.42);display:none;
  align-items:flex-start;justify-content:center;z-index:50;
  padding-top:calc(env(safe-area-inset-top,0px) + clamp(4.5rem,14vh,7rem));}
.sheet.open{display:flex;}
.sheet-card{position:relative;background:var(--bg);width:min(34rem,92vw);
  max-height:78vh;overflow:hidden;display:flex;flex-direction:column;
  border-radius:20px;padding:1.3rem 1.5rem 1.4rem;box-shadow:0 20px 60px rgba(32,30,28,.25);}
.close-btn{position:absolute;top:.7rem;right:.7rem;border:none;background:var(--tile-bg);
  width:30px;height:30px;border-radius:50%;cursor:pointer;color:var(--dim);
  display:flex;align-items:center;justify-content:center;}
.card-h{display:flex;align-items:baseline;gap:.7rem;margin-bottom:.4rem;}
.card-h b{font-size:1.4rem;font-weight:900;color:var(--accent-ink);line-height:1;}
.card-h span{font-size:1.05rem;font-weight:700;}
.card-h i{margin-left:auto;font-style:normal;font-family:var(--f-mono);font-size:.7rem;color:var(--dim);}
.card-bar{height:7px;border-radius:2px;background:var(--slot-bg);margin-bottom:1rem;overflow:hidden;}
.card-bar i{display:block;height:100%;background:var(--accent);transition:width .3s;}

.qcard{background:var(--tile-bg);border-radius:16px;padding:1.3rem;margin-bottom:.9rem;}
.qemoji{font-size:40px;text-align:center;margin-bottom:10px;}
.qtext{font-size:1.1rem;font-weight:700;margin:0 0 1.1rem;line-height:1.4;}
.opt{display:block;width:100%;text-align:left;padding:.85rem 1rem;margin-bottom:.6rem;
  border-radius:12px;background:var(--bg);border:1.5px solid var(--rule);
  font-size:.98rem;font-weight:600;color:var(--ink);cursor:pointer;transition:all .15s;}
.opt:active{transform:scale(.98);}
.opt.correct{background:rgba(90,138,94,.16);border-color:var(--green);color:var(--green);animation:pop .35s ease;}
.opt.wrong{background:rgba(184,74,62,.14);border-color:var(--wrong);color:var(--wrong);}
.opt.disabled{pointer-events:none;}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.05);}100%{transform:scale(1);}}
.feedback{text-align:center;font-weight:700;font-size:.92rem;margin:.3rem 0 .9rem;min-height:18px;}
.feedback.ok{color:var(--green);}
.feedback.bad{color:var(--wrong);}
.nextbtn{display:block;width:100%;padding:.9rem;border:none;border-radius:14px;
  background:var(--accent-ink);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;}
.nextbtn:disabled{opacity:.4;}
.result{text-align:center;padding:1rem 0;}
.result .score{font-size:2.6rem;font-weight:900;margin:.5rem 0;color:var(--accent-ink);}
.result p{color:var(--dim);font-size:.9rem;}
.restart{margin-top:1rem;padding:.8rem 1.4rem;border:none;border-radius:14px;
  background:var(--accent-ink);color:#fff;font-weight:700;font-size:.9rem;cursor:pointer;}

/* ── celebration fx ─────────────────────────────────────────────────── */
.points-fly{position:fixed;font-weight:800;font-size:1.1rem;color:var(--green);z-index:200;
  pointer-events:none;animation:fly 1s ease-out forwards;}
@keyframes fly{to{opacity:0;transform:translateY(-60px);}}
.confetti-piece{position:fixed;top:-20px;font-size:1.3rem;z-index:199;pointer-events:none;
  animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.15;}}
.streak-banner{position:fixed;top:80px;left:50%;transform:translate(-50%,-20px);z-index:201;
  background:linear-gradient(90deg,var(--accent),var(--accent-ink));color:#fff;font-weight:800;
  font-size:.8rem;padding:.6rem 1.2rem;border-radius:999px;box-shadow:0 6px 20px rgba(32,30,28,.25);
  opacity:0;animation:banner 1.6s ease forwards;}
@keyframes banner{15%{opacity:1;transform:translate(-50%,0);}85%{opacity:1;transform:translate(-50%,0);}100%{opacity:0;transform:translate(-50%,-20px);}}
</style>
</head>
<body>

let progress = {};
Object.keys(DATA).forEach(k=>progress[k]={done:0,score:0});
let current = null, qi = 0, answered = false, streak = 0;

const PRAISE = ["Awesome! 🎉","Brilliant! ✨","You got it! 🚀","Nice one! 🙌","Superb! 🌟","Great job! 👏","Excellent! 💫"];
const ENCOURAGE = ["Nice try — keep going! 💪","Almost there! 🌱","No worries, you've got this! 🙂","Good attempt — try the next one! 🔄","Keep practising! 📚","So close!"];

const $ = id => document.getElementById(id);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function totalMax(){ return Object.values(DATA).reduce((a,c)=>a+c.q.length,0); }
function updateBadge(){
  let s=0; Object.values(progress).forEach(p=>s+=p.score);
  $('totalBadge').textContent = `⭐ ${s} / ${totalMax()}`;
}
function pulseBadge(id){ const el=$(id); el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
function updateStreakBadge(){ $('streakBadge').textContent = `🔥 ${streak}`; }
function flyPoints(x,y,text){
  const el=document.createElement('div'); el.className='points-fly'; el.textContent=text;
  el.style.left=x+'px'; el.style.top=y+'px'; document.body.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}
function confettiBurst(){
  const emojis=['🎉','✨','⭐','🎊','💫'];
  for(let i=0;i<14;i++){
    const el=document.createElement('div'); el.className='confetti-piece';
    el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left=Math.random()*100+'vw'; el.style.animationDuration=(1.2+Math.random()*0.8)+'s';
    document.body.appendChild(el); setTimeout(()=>el.remove(),2200);
  }
}
function streakBanner(msg){
  const el=document.createElement('div'); el.className='streak-banner'; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(),1700);
}

function renderDials(){
  const el = $('dials');
  el.innerHTML = Object.keys(DATA).map((k,i)=>{
    const d = DATA[k];
    return `<button class="dial-b" type="button" aria-label="${d.name}" onclick="openCard('${k}', this)">
      <div class="pend-hang" style="animation-delay:${(i*-1.3).toFixed(2)}s" aria-hidden="true">
        <div class="pend-dial"><span>${d.emoji}</span></div>
      </div>
      <span class="dial-name">${d.name}</span>
      <div class="dial-track" id="track-${k}"><i></i></div>
    </button>`;
  }).join('');
  Object.keys(DATA).forEach(k=>{
    const p=progress[k], d=DATA[k], pct=Math.round((p.done/d.q.length)*100);
    $('track-'+k).querySelector('i').style.width = pct+'%';
  });
}

let lastDial = null;
function openCard(k, from){
  current = k; qi = 0; answered = false;
  progress[k] = {done:0, score:0};
  const d = DATA[k];
  shuffle(d.q);
  const h = $('cardH');
  h.querySelector('b').textContent = d.emoji;
  h.querySelector('span').textContent = d.name;
  h.querySelector('i').textContent = d.q.length + ' questions';
  $('cardBar').style.width = '0%';
  lastDial = from;
  $('card').classList.add('open');
  renderQuestion();
}
function closeCard(){
  $('card').classList.remove('open');
  renderDials(); updateBadge();
  if(lastDial) lastDial.focus({preventScroll:true});
}
$('cardX').addEventListener('click', closeCard);

function renderQuestion(){
  const d = DATA[current];
  if(qi >= d.q.length){ renderResult(); return; }
  const q = d.q[qi];
  answered = false;
  $('cardBar').style.width = Math.round((qi/d.q.length)*100)+'%';
  $('modalBody').innerHTML = `
    <div class="qcard">
      ${q.emoji ? `<div class="qemoji">${q.emoji}</div>` : ''}
      <p class="qtext">${q.text}</p>
      <div id="opts">
        ${shuffle(q.options.slice()).map(o=>`<button class="opt" onclick="selectOpt(this,'${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}
      </div>
    </div>
    <div class="feedback" id="fb"></div>
    <button class="nextbtn" id="nextBtn" disabled onclick="nextQuestion()">Next</button>
  `;
}

function selectOpt(btn, val){
  if(answered) return;
  answered = true;
  const d = DATA[current], q = d.q[qi];
  const fb = $('fb');
  document.querySelectorAll('#opts .opt').forEach(o=>{
    o.classList.add('disabled');
    if(o.textContent === q.answer) o.classList.add('correct');
  });
  progress[current].done++;
  const rect = btn.getBoundingClientRect();
  if(val === q.answer){
    btn.classList.add('correct');
    fb.textContent = '✓ ' + PRAISE[Math.floor(Math.random()*PRAISE.length)];
    fb.className = 'feedback ok';
    progress[current].score++;
    streak++;
    updateStreakBadge(); pulseBadge('streakBadge');
    flyPoints(rect.left+rect.width/2, rect.top, '+10');
    confettiBurst();
    if(streak>0 && streak%3===0) streakBanner(`🔥 ${streak} in a row!`);
  } else {
    btn.classList.add('wrong');
    fb.textContent = '✗ ' + ENCOURAGE[Math.floor(Math.random()*ENCOURAGE.length)] + ` (Answer: "${q.answer}")`;
    fb.className = 'feedback bad';
    streak = 0; updateStreakBadge();
  }
  $('nextBtn').disabled = false;
}
function nextQuestion(){ qi++; renderQuestion(); }

function renderResult(){
  const d = DATA[current], p = progress[current];
  $('cardBar').style.width = '100%';
  $('modalBody').innerHTML = `
    <div class="result">
      <div style="font-size:2.4rem;">${p.score===d.q.length?'🏆':p.score>=d.q.length/2?'🎉':'💪'}</div>
      <div class="score">${p.score}/${d.q.length}</div>
      <p>Tap restart to try again, or close to pick another topic.</p>
      <button class="restart" onclick="openCard('${current}', lastDial)">Restart</button>
    </div>`;
  updateBadge();
}

renderDials();
updateBadge();
$('card').addEventListener('click', e=>{ if(e.target.id==='card') closeCard(); });
</script>
</body>
</html>
